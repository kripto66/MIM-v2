<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM — Interventions</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar" id="sidebar" data-breakpoint="800">

            <div
                class="logo"
                data-sidebar-toggle-logo
                role="button"
                tabindex="0"
                aria-label="Ouvrir ou fermer le menu"
                aria-expanded="false"
            >
                <img src="../images/logoMim-opt.png" alt="MIM">
            </div>

            <nav class="sidebar-menu">

                <a href="dashboard.html">Tableau de bord</a>
                <a href="biens.html">Mes biens</a>
                <a href="locataires.html">Locataires & Logements</a>
                <a href="paiements.html">Paiements</a>
                <a href="incidents.html">Incidents</a>
                <a href="prestataires.html">Prestataires</a>
                <a href="interventions.html" class="active">Interventions</a>
                <a href="notifications.html">Notifications</a>
                <a href="parametres.html">Paramètres</a>

            </nav>

            <div class="sidebar-footer">

                <button id="backupBtn" type="button">Sauvegarder</button>
                <button id="logoutBtn" type="button">Déconnexion</button>

            </div>

        </aside>

        <main class="main-content">

            <header class="dashboard-header">

                <button
                    class="menu-toggle"
                    data-sidebar-toggle
                    aria-label="Ouvrir le menu"
                    aria-expanded="false"
                >
                    ☰
                </button>

                <div class="welcome">
                    <h1>Interventions</h1>
                    <p>Planifiez et suivez les interventions de maintenance.</p>
                </div>

                <button class="btn btn-primary" id="addInterventionBtn">+ Planifier une intervention</button>

            </header>

            <section class="dashboard-section">

                <div class="section-header">
                    <h2>Liste des interventions</h2>
                </div>

                <div id="interventionsList">
                    <div class="empty-state">Chargement...</div>
                </div>

            </section>

        </main>

    </div>

    <div class="modal-overlay" id="interventionModal" style="display:none;">
        <div class="modal">

            <h2 id="modalTitle">Planifier une intervention</h2>

            <form id="interventionForm">

                <input type="hidden" id="interventionId">

                <div class="form-group">
                    <label for="titre">Titre</label>
                    <input type="text" id="titre" name="titre" placeholder="Ex : Réparation fuite d'eau" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="incident_id">Incident lié</label>
                        <select id="incident_id" name="incident_id">
                            <option value="">— Aucun —</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prestataire_id">Prestataire</label>
                        <select id="prestataire_id" name="prestataire_id">
                            <option value="">— Aucun —</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="logement_id">Logement</label>
                        <select id="logement_id" name="logement_id">
                            <option value="">— Aucun —</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="statut">Statut</label>
                        <select id="statut" name="statut">
                            <option value="planifie">Planifiée</option>
                            <option value="en_cours">En cours</option>
                            <option value="termine">Terminée</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="date_prevue">Date prévue</label>
                    <input type="date" id="date_prevue" name="date_prevue">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelModal">Annuler</button>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>

            </form>

        </div>
    </div>

    <script src="../PartPublic/form-utils.js"></script>
    <script src="api.js"></script>
    <script src="crud.js"></script>
    <script>
        const INTERVENTION_STATUS = {
            planifie: ["Planifiée", "status-info"],
            en_cours: ["En cours", "status-warning"],
            termine: ["Terminée", "status-success"],
        };

        let incidentsCache = [];
        let prestatairesCache = [];
        let logementsCache = [];

        async function loadData() {
            try {
                const [inc, pre, log] = await Promise.all([
                    apiRequest("/incidents"),
                    apiRequest("/prestataires"),
                    apiRequest("/logements"),
                ]);
                incidentsCache = inc.data;
                prestatairesCache = pre.data;
                logementsCache = log.data;

                document.getElementById("incident_id").innerHTML =
                    '<option value="">— Aucun —</option>' + inc.data.map(
                        (i) => `<option value="${i.id}">${escapeHtml(i.titre)}</option>`
                    ).join("");

                document.getElementById("prestataire_id").innerHTML =
                    '<option value="">— Aucun —</option>' + pre.data.map(
                        (p) => `<option value="${p.id}">${escapeHtml(p.nom)}</option>`
                    ).join("");

                document.getElementById("logement_id").innerHTML =
                    '<option value="">— Aucun —</option>' + log.data.map(
                        (l) => `<option value="${l.id}">${escapeHtml(l.nom)}</option>`
                    ).join("");
            } catch (err) {
                console.error(err);
            }
        }

        function formatDate(d) {
            if (!d) return "";
            const dt = new Date(d);
            return dt.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
        }

        CrudPage.init({
            resource: "interventions",
            listEl: "interventionsList",
            addBtnEl: "addInterventionBtn",
            modalId: "interventionModal",
            modalTitleId: "modalTitle",
            formId: "interventionForm",
            idFieldId: "interventionId",
            cancelBtnId: "cancelModal",
            validate: (form) => validateFields(form, [
                {
                    name: "titre",
                    test: (i) => !i.value.trim(),
                    message: "Le titre de l'intervention est obligatoire.",
                },
                {
                    name: "incident_id",
                    test: (i) => !i.value,
                    message: "Choisissez l'incident concerné.",
                },
            ]),
            renderItem: (i) => {
                const [label, cls] = INTERVENTION_STATUS[i.statut] || [i.statut, "status-info"];
                const incident = incidentsCache.find((x) => String(x.id) === String(i.incident_id));
                const prestataire = prestatairesCache.find((x) => String(x.id) === String(i.prestataire_id));
                const logement = logementsCache.find((x) => String(x.id) === String(i.logement_id));
                return `
                    <div class="crud-card">
                        <div>
                            <h3>${escapeHtml(i.titre)}</h3>
                            <p>${prestataire ? "Prestataire : " + escapeHtml(prestataire.nom) : ""}</p>
                            <p>${logement ? "Logement : " + escapeHtml(logement.nom) : ""}</p>
                            ${i.date_prevue ? `<p>Prévue le ${formatDate(i.date_prevue)}</p>` : ''}
                            <p><span class="status ${cls}">${label}</span></p>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-edit" data-edit="${i.id}">Modifier</button>
                            <button class="btn btn-delete" data-delete="${i.id}">Supprimer</button>
                        </div>
                    </div>`;
            }
        });

        loadData();
    </script>

    <script src="../PartPublic/sidebar.js"></script>

</body>

</html>
