<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM — Logements</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <div class="logo">
                MIM
            </div>

            <nav class="sidebar-menu">

                <a href="dashboard.html">Tableau de bord</a>
                <a href="biens.html">Mes biens</a>
                <a href="logements.html" class="active">Logements</a>
                <a href="locataires.html">Locataires</a>
                <a href="paiements.html">Paiements</a>
                <a href="incidents.html">Incidents</a>
                <a href="prestataires.html">Prestataires</a>
                <a href="interventions.html">Interventions</a>
                <a href="notifications.html">Notifications</a>
                <a href="parametres.html">Paramètres</a>

            </nav>

            <div class="sidebar-footer">

                <button id="backupBtn" type="button">Sauvegarder</button>
                <button id="logoutBtn" type="button">Déconnexion</button>

            </div>

        </aside>

        <main class="main-content">

            <header class="dashboard-header">

                <div class="welcome">
                    <h1>Logements</h1>
                    <p>Gérez les logements de vos biens.</p>
                </div>

                <button class="btn btn-primary" id="addLogementBtn">+ Ajouter un logement</button>

            </header>

            <section class="dashboard-section">

                <div class="section-header">
                    <h2>Liste des logements</h2>
                </div>

                <div id="logementsList">
                    <div class="empty-state">Chargement...</div>
                </div>

            </section>

        </main>

    </div>

    <div class="modal-overlay" id="logementModal" style="display:none;">
        <div class="modal">

            <h2 id="modalTitle">Ajouter un logement</h2>

            <form id="logementForm">

                <input type="hidden" id="logementId">

                <div class="form-group">
                    <label for="nom">Nom du logement</label>
                    <input type="text" id="nom" name="nom" placeholder="Ex : Appartement A12" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="type">Type de logement</label>
                        <select id="type" name="type">
                            <option value="appartement">Appartement</option>
                            <option value="chambre">Chambre</option>
                        </select>
                    </div>
                    <div class="form-group" id="chambresGroup">
                        <label for="nombre_chambres">Nombre de chambres</label>
                        <input type="number" id="nombre_chambres" name="nombre_chambres" min="1" max="50" placeholder="ex : 3">
                    </div>
                </div>

                <div class="form-group">
                    <label for="bien_id">Bien</label>
                    <select id="bien_id" name="bien_id">
                        <option value="">— Aucun —</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="loyer_mensuel">Loyer mensuel (FCFA)</label>
                        <input type="number" id="loyer_mensuel" name="loyer_mensuel" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="statut">Statut</label>
                        <select id="statut" name="statut">
                            <option value="libre">Libre</option>
                            <option value="occupe">Occupé</option>
                            <option value="maintenance">En maintenance</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="adresse">Adresse du logement</label>
                    <input type="text" id="adresse" name="adresse" placeholder="Ex : Rue 12, Sicap Mbao">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelModal">Annuler</button>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>

            </form>

        </div>
    </div>

    <script src="../PartPublic/form-utils.js"></script>
    <script src="api.js"></script>
    <script src="crud.js"></script>
    <script>
        const LOGEMENT_STATUS = {
            libre: ["Libre", "status-success"],
            occupe: ["Occupé", "status-info"],
            maintenance: ["En maintenance", "status-warning"],
        };

        let biensCache = [];

        function toggleChambres() {
            const type = document.getElementById("type").value;
            const group = document.getElementById("chambresGroup");
            const field = document.getElementById("nombre_chambres");
            if (type === "appartement") {
                group.style.display = "block";
                field.setAttribute("required", "");
            } else {
                group.style.display = "none";
                field.removeAttribute("required");
                field.value = "";
            }
        }

        async function loadBiens() {
            try {
                const { data } = await apiRequest("/biens");
                biensCache = data;
                const select = document.getElementById("bien_id");
                select.innerHTML = '<option value="">— Aucun —</option>' + data.map(
                    (b) => `<option value="${b.id}">${escapeHtml(b.nom)}</option>`
                ).join("");
            } catch (err) {
                console.error(err);
            }
        }

        CrudPage.init({
            resource: "logements",
            listEl: "logementsList",
            addBtnEl: "addLogementBtn",
            modalId: "logementModal",
            modalTitleId: "modalTitle",
            formId: "logementForm",
            idFieldId: "logementId",
            cancelBtnId: "cancelModal",
            validate: (form) => {
                const type = form.type.value;
                return validateFields(form, [
                    {
                        name: "nom",
                        test: (i) => !i.value.trim(),
                        message: "Le nom du logement est obligatoire.",
                    },
                    {
                        name: "bien_id",
                        test: (i) => !i.value,
                        message: "Choisissez le bien du logement.",
                    },
                    {
                        name: "loyer_mensuel",
                        test: (i) => i.value === "" || Number(i.value) < 0,
                        message: "Saisissez un loyer mensuel valide.",
                    },
                    {
                        name: "adresse",
                        test: (i) => !i.value.trim(),
                        message: "L'adresse du logement est obligatoire.",
                    },
                    {
                        name: "nombre_chambres",
                        test: (i) => type === "appartement" && (i.value === "" || Number(i.value) < 1),
                        message: "Indiquez le nombre de chambres.",
                    },
                ]);
            },
            onOpenAdd: (form) => {
                form.type.value = "appartement";
                toggleChambres();
            },
            onOpenEdit: (form, item) => {
                toggleChambres();
            },
            afterInit: () => {
                document.getElementById("type").addEventListener("change", toggleChambres);
                toggleChambres();
            },
            renderItem: (l) => {
                const [label, cls] = LOGEMENT_STATUS[l.statut] || [l.statut, "status-info"];
                const bien = biensCache.find((b) => String(b.id) === String(l.bien_id));
                const typeLabel = l.type === "chambre" ? "Chambre" : "Appartement";
                return `
                    <div class="crud-card">
                        <div>
                            <h3>${escapeHtml(l.nom)}</h3>
                            <p>${bien ? escapeHtml(bien.nom) : "Sans bien"} · ${typeLabel}${l.nombre_chambres ? " · " + escapeHtml(l.nombre_chambres) + " chambres" : ""}</p>
                            <p>${l.adresse ? escapeHtml(l.adresse) : ""}</p>
                            <p><span class="status ${cls}">${label}</span></p>
                            <p><strong>${Number(l.loyer_mensuel).toLocaleString("fr-FR")} FCFA</strong> / mois</p>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-edit" data-edit="${l.id}">Modifier</button>
                            <button class="btn btn-delete" data-delete="${l.id}">Supprimer</button>
                        </div>
                    </div>`;
            }
        });

        loadBiens();
    </script>

</body>

</html>
