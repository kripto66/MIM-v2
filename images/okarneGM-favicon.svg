<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1a2d47"/>
    </linearGradient>
    <linearGradient id="favOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e85d27"/>
    </linearGradient>
  </defs>
  
  <!-- Simplified standalone symbol for favicon -->
  <!-- Abstract: geometric building + tech connection simplified for small size -->
  <g>
    <!-- Main shape: simplified polygon representing property + tech -->
    <polygon points="32,0 64,32 32,64 0,32" fill="url(#favGrad)"/>
    
    <!-- Orange accent circle: tech focus -->
    <circle cx="32" cy="32" r="8" fill="url(#favOrangeGrad)"/>
    
    <!-- Central connection point -->
    <circle cx="32" cy="32" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Wordmark simplified for favicon -->
  <g transform="translate(0, 50)">
    <text x="0" y="18" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">
      <tspan>O</tspan>
      <tspan fill="#ff6b35" dx="12">K</tspan>
      <tspan fill="#ffffff" dx="12">A</tspan>
      <tspan fill="#ff6b35" dx="12">R</tspan>
      <tspan fill="#ffffff" dx="12">N</tspan>
      <tspan fill="#ff6b35" dx="12">E</tspan>
    </text>
    <text x="0" y="30" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">
      <tspan fill="#ff6b35">GM</tspan>
    </text>
  </g>
</svg>