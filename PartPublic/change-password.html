<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Changer le mot de passe — MyImmoManagement</title>
    <link rel="stylesheet" href="/mim-errors.css">
    <script src="/mim-errors.js"></script>


    <link rel="stylesheet" href="connexion.css">

</head>

<body>

    <main>

        <section id="connexion">

            <div class="title-login">
                <span class="logo">MIM</span>
                <h1>Changer le mot de passe</h1>
            </div>

            <p>
                Pour votre première connexion, choisissez un nouveau mot de passe.
            </p>

            <form id="passwordForm">

                <div class="form-group">
                    <label for="password">
                        Nouveau mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 8 caractères"
                        autocomplete="new-password"
                        minlength="8"
                        data-strength
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password_confirm">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        placeholder="Confirmer le mot de passe"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit">
                    Enregistrer le mot de passe
                </button>

            </form>

            <p>
                <a href="connexion.html">Retour à la connexion</a>
            </p>

        </section>

    </main>

    <div id="loginMessage"></div>

    <script src="form-utils.js"></script>
    <script src="password-strength.js"></script>
    <script>
        const API = mimApiBase();

        // Le paramètre ?next= est optionnel. Il doit être un chemin INTERNE
        // (relatif ou racine) : on refuse toute valeur absolue (https://…),
        // protocol-relative (//…), tout schéma (javascript:…) et tout chemin
        // utilisant des antislashs (parades contre les redirections externes).
        const nextParam = new URLSearchParams(window.location.search).get('next');
        let next = '../PartLocataires/LocaDash.html';
        if (nextParam) {
            const isInternalPath = nextParam.startsWith('/') || nextParam.startsWith('./') || nextParam.startsWith('../');
            const hasScheme = /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(nextParam);
            if (isInternalPath && !hasScheme && !nextParam.includes('\\')) {
                next = nextParam;
            }
        }
        const loginMessage = document.getElementById('loginMessage');

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const message = document.getElementById('loginMessage');
            const button = form.querySelector('button[type="submit"]');

            clearFormErrors(form);
            message.textContent = '';
            message.className = '';

            const pw = form.password.value;
            const confirm = form.password_confirm.value;

            let hasErrors = false;
            const pwRule = mimPasswordRuleMessage(pw);
            if (pwRule) {
                formFieldError(form, 'password', pwRule);
                hasErrors = true;
            }
            if (!confirm) {
                formFieldError(form, 'password_confirm', 'Veuillez confirmer votre mot de passe.');
                hasErrors = true;
            } else if (pw !== confirm) {
                formFieldError(form, 'password_confirm', 'Les mots de passe ne correspondent pas.');
                hasErrors = true;
            }
            if (hasErrors) return;

            button.disabled = true;
            button.textContent = 'Enregistrement...';

            try {
                const response = await fetch(API + '/auth/change-password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        password: form.password.value,
                        password_confirm: form.password_confirm.value
                    })
                });

                const data = await response.json();

                if (data.success) {
                    message.textContent = data.message;
                    message.className = 'success';
                    window.location.href = next;
                } else {
                    message.textContent = data.message;
                    message.className = 'error';
                    applyServerErrors(form, data.errors);
                }
            } catch (error) {
                console.error('Erreur:', error);
                message.textContent = 'Impossible de contacter le serveur.';
                message.className = 'error';
            }

            button.disabled = false;
            button.textContent = 'Enregistrer le mot de passe';
        });
    </script>

</body>

</html>
