<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Changer le mot de passe — MyImmoManagement</title>
    <link rel="stylesheet" href="/mim-errors.css">
    <script src="/mim-errors.js"></script>


    <link rel="stylesheet" href="connexion.css">

</head>

<body>

    <main>

        <section id="connexion">

            <div class="title-login">
                <span class="logo">MIM</span>
                <h1>Modifier vos identifiants</h1>
            </div>

            <p>
                Pour votre première connexion, choisissez un nouveau username (facultatif)
                et un nouveau mot de passe.
            </p>

            <form id="passwordForm">

                <div class="form-group" id="usernameGroup">
                    <label for="username">
                        Nouveau username (connexion)
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ex : amadou.diop2"
                        autocomplete="username"
                    >
                    <small class="username-status" id="usernameStatus"></small>
                    <p class="form-hint">
                        Votre username actuel est pré-rempli : gardez-le ou choisissez-en un nouveau.
                    </p>
                </div>

                <div class="form-group">
                    <label for="password">
                        Nouveau mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 8 caractères"
                        autocomplete="new-password"
                        minlength="8"
                        data-strength
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password_confirm">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        placeholder="Confirmer le mot de passe"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit">
                    Enregistrer mes identifiants
                </button>

            </form>

            <p>
                <a href="connexion.html">Retour à la connexion</a>
            </p>

        </section>

    </main>

    <div id="loginMessage"></div>

    <script src="form-utils.js"></script>
    <script src="password-strength.js"></script>
    <script>
        const API = mimApiBase();

        // Le paramètre ?next= est optionnel. Il doit être un chemin INTERNE
        // (relatif ou racine) : on refuse toute valeur absolue (https://…),
        // protocol-relative (//…), tout schéma (javascript:…) et tout chemin
        // utilisant des antislashs (parades contre les redirections externes).
        const nextParam = new URLSearchParams(window.location.search).get('next');
        let next = '../PartLocataires/LocaDash.html';
        if (nextParam) {
            const isInternalPath = nextParam.startsWith('/') || nextParam.startsWith('./') || nextParam.startsWith('../');
            const hasScheme = /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(nextParam);
            if (isInternalPath && !hasScheme && !nextParam.includes('\\')) {
                next = nextParam;
            }
        }
        const loginMessage = document.getElementById('loginMessage');
        const usernameInput = document.getElementById('username');
        const usernameStatus = document.getElementById('usernameStatus');
        const usernameGroup = document.getElementById('usernameGroup');
        let currentUsername = '';

        function usernameValid(u) {
            return /^[a-z0-9._-]{3,32}$/.test(u);
        }

        // Pré-remplit le username actuel (comptes locataires/employés uniquement).
        fetch(API + '/auth/me', { credentials: 'include' })
            .then((r) => r.json())
            .then((d) => {
                if (d.success && d.user && d.user.username) {
                    currentUsername = d.user.username;
                    usernameInput.value = currentUsername;
                } else {
                    usernameGroup.style.display = 'none';
                }
            })
            .catch(() => {
                usernameGroup.style.display = 'none';
            });

        usernameInput.addEventListener('blur', async () => {
            const value = usernameInput.value.trim();
            if (!value || value === currentUsername) {
                usernameStatus.textContent = '';
                usernameStatus.className = '';
                return;
            }
            if (!usernameValid(value)) {
                usernameStatus.textContent = 'Lettres minuscules, chiffres, . _ - (3 à 32 caractères).';
                usernameStatus.className = 'username-status username-taken';
                return;
            }
            try {
                const resp = await fetch(API + '/auth/username-available?username=' + encodeURIComponent(value), {
                    credentials: 'include',
                });
                const data = await resp.json();
                if (data.available) {
                    usernameStatus.textContent = 'Disponible';
                    usernameStatus.className = 'username-status username-ok';
                } else {
                    usernameStatus.textContent = 'Ce nom d\'utilisateur est déjà utilisé.';
                    usernameStatus.className = 'username-status username-taken';
                }
            } catch (err) {
                usernameStatus.textContent = '';
                usernameStatus.className = '';
            }
        });

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const message = document.getElementById('loginMessage');
            const button = form.querySelector('button[type="submit"]');

            clearFormErrors(form);
            message.textContent = '';
            message.className = '';

            const newUsername = usernameInput.value.trim();
            const pw = form.password.value;
            const confirm = form.password_confirm.value;

            let hasErrors = false;
            if (newUsername && newUsername !== currentUsername) {
                if (!usernameValid(newUsername)) {
                    formFieldError(form, 'username', 'Username invalide : lettres minuscules, chiffres, . _ - (3 à 32 caractères).');
                    hasErrors = true;
                } else if (usernameStatus.className.includes('username-taken')) {
                    formFieldError(form, 'username', 'Ce nom d\'utilisateur est déjà utilisé.');
                    hasErrors = true;
                }
            }
            const pwRule = mimPasswordRuleMessage(pw);
            if (pwRule) {
                formFieldError(form, 'password', pwRule);
                hasErrors = true;
            }
            if (!confirm) {
                formFieldError(form, 'password_confirm', 'Veuillez confirmer votre mot de passe.');
                hasErrors = true;
            } else if (pw !== confirm) {
                formFieldError(form, 'password_confirm', 'Les mots de passe ne correspondent pas.');
                hasErrors = true;
            }
            if (hasErrors) return;

            button.disabled = true;
            button.textContent = 'Enregistrement...';

            try {
                // 1) Nouveau username (optionnel) avant le mot de passe.
                if (newUsername && newUsername !== currentUsername) {
                    const usernameResp = await fetch(API + '/auth/update-username', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username: newUsername }),
                    });
                    const usernameData = await usernameResp.json();
                    if (!usernameData.success) {
                        message.textContent = usernameData.message || 'Impossible de modifier le username.';
                        message.className = 'error';
                        applyServerErrors(form, usernameData.errors);
                        button.disabled = false;
                        button.textContent = 'Enregistrer mes identifiants';
                        return;
                    }
                }

                // 2) Nouveau mot de passe (désactive must_change_password).
                const response = await fetch(API + '/auth/change-password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        password: form.password.value,
                        password_confirm: form.password_confirm.value
                    })
                });

                const data = await response.json();

                if (data.success) {
                    message.textContent = data.message;
                    message.className = 'success';
                    window.location.href = next;
                } else {
                    message.textContent = data.message;
                    message.className = 'error';
                    applyServerErrors(form, data.errors);
                }
            } catch (error) {
                console.error('Erreur:', error);
                message.textContent = 'Impossible de contacter le serveur.';
                message.className = 'error';
            }

            button.disabled = false;
            button.textContent = 'Enregistrer mes identifiants';
        });
    </script>

</body>

</html>
