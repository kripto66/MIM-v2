<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Changer le mot de passe — MyImmoManagement</title>
    <link rel="stylesheet" href="/mim-errors.css">
    <script src="/mim-errors.js"></script>


    <link rel="stylesheet" href="connexion.css">

</head>

<body>

    <main>

        <section id="connexion">

            <div class="title-login">
                <span class="logo">MIM</span>
                <h1>Modifier vos identifiants</h1>
            </div>

            <p>
                Pour votre première connexion, choisissez un nouveau username (facultatif)
                et un nouveau mot de passe.
            </p>

            <form id="passwordForm">

                <div class="form-group" id="usernameGroup">
                    <label for="username">
                        Nouveau username (connexion)
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ex : amadou.diop2"
                        autocomplete="username"
                    >
                    <small class="username-status" id="usernameStatus"></small>
                    <p class="form-hint">
                        Votre username actuel est pré-rempli : gardez-le ou choisissez-en un nouveau.
                    </p>
                </div>

                <div class="form-group">
                    <label for="password">
                        Nouveau mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 8 caractères"
                        autocomplete="new-password"
                        minlength="8"
                        data-strength
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password_confirm">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        placeholder="Confirmer le mot de passe"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group" id="currentPasswordGroup" style="display:none">
                    <label for="current_password">
                        Mot de passe actuel
                    </label>

                    <input
                        type="password"
                        id="current_password"
                        name="current_password"
                        placeholder="Votre mot de passe actuel"
                        autocomplete="current-password"
                    >
                    <p class="form-hint">
                        Requis hors changement forcé (première connexion).
                    </p>
                </div>

                <button type="submit">
                    Enregistrer mes identifiants
                </button>

            </form>

            <p>
                <a href="connexion.html">Retour à la connexion</a>
            </p>

        </section>

    </main>

    <div id="loginMessage"></div>

    <script src="form-utils.js"></script>
    <script src="password-strength.js"></script>
    <script src="change-password.js"></script>

</body>

</html>
