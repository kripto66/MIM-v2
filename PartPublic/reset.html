<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Réinitialiser le mot de passe — Okarne Global Management</title>

    <meta name="description" content="Choisissez un nouveau mot de passe pour votre compte Okarne Global Management.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://mim-app.com/reset">

    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="/mim-errors.css">
    <script src="/mim-errors.js"></script>

</head>

<body>

    <main class="auth-shell auth-center">

        <section class="auth-panel">

            <div class="auth-card auth-card-sm">

                <a class="brand-mobile" href="index.html">
                    <span class="brand-mark">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5"/><path d="M5 11v8h14v-8"/><path d="M9.5 19v-5h5v5"/></svg>
                    </span>
                    <span class="brand-text">MyImmo<strong>Management</strong></span>
                </a>

                <div class="auth-head">
                    <h2>Nouveau mot de passe</h2>
                    <p class="auth-sub">Choisissez un nouveau mot de passe pour votre compte.</p>
                </div>

                <div id="resetMessage"></div>

                <form id="resetForm" novalidate>

                    <div class="form-group">
                        <label for="password">Nouveau mot de passe</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Minimum 8 caractères"
                            minlength="8"
                            autocomplete="new-password"
                            data-strength
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password_confirm">Confirmer le mot de passe</label>
                        <input
                            type="password"
                            id="password_confirm"
                            name="password_confirm"
                            placeholder="Confirmer votre mot de passe"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button class="btn btn-gold btn-block" type="submit">Réinitialiser mon mot de passe</button>

                </form>

                <a class="back-login" href="connexion.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Retour à la connexion
                </a>

            </div>

        </section>

    </main>

    <script src="form-utils.js"></script>
    <script src="password-strength.js"></script>
    <script src="reset.js"></script>

</body>

</html>
