<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — MyImmoManagement</title>

    <link rel="stylesheet" href="connexion.css">

    <link rel="stylesheet" href="/mim-errors.css">

</head>

<body>

    <main>

        <section id="connexion">
           <div class="title-login">
    <span class="logo">MIM</span>
    <h1>Connexion</h1>
</div>

            <p>
                Connectez-vous à votre espace MyImmoManagement.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="identifier">
                        Username ou email
                    </label>

                    <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        placeholder="Votre username ou email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit">
                    Se connecter
                </button>

            </form>

            <div class="divider">
                <span>ou</span>
            </div>

            <a
                class="google-btn"
                href="/api/auth/google"
            >
                <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Se connecter avec Google
            </a>

            <p>
                <a href="forgot.html">
                    Mot de passe oublié ?
                </a>
            </p>

            <p>
                Vous n'avez pas encore de compte ?
                <a href="createCompte.html">
                    Créer un compte
                </a>
            </p>

        </section>

    </main>

    <div id="loginMessage"></div>

    <script src="form-utils.js"></script>
    <script src="/mim-errors.js"></script>
    <script src="connexion.js"></script>

</body>

</html>
