<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mot de passe oublié — MIM</title>

    <link rel="stylesheet" href="forgot.css">

</head>

<body>

    <main class="container">

        <section class="forgot-card">

            <div class="logo">
                MIM
            </div>

            <h1>
                Mot de passe oublié ?
            </h1>

            <p class="description">
                Pas de problème. Entrez votre adresse email
                et nous vous enverrons un lien pour
                réinitialiser votre mot de passe.
            </p>

            <form id="forgotForm">

                <div class="form-group">

                    <label for="email">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@email.com"
                        required
                    >

                </div>

                <div id="forgotMessage"></div>

                <button type="submit">
                    Envoyer le lien
                </button>

            </form>

            <a class="back-login" href="connexion.html">
                ← Retour à la connexion
            </a>

        </section>

    </main>

    <script>
        const API = (() => {
            const origin = window.location.origin || "http://localhost:3000";
            const isLocal = origin.includes("localhost") || origin.includes("127.0.0.1");
            return (isLocal ? "http://localhost:3000" : origin) + "/api";
        })();

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const message = document.getElementById('forgotMessage');
            const button = form.querySelector('button[type="submit"]');

            message.textContent = '';
            button.disabled = true;
            button.textContent = 'Envoi...';

            try {
                const response = await fetch(API + '/auth/forgot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: form.email.value })
                });

                const data = await response.json();
                message.textContent = data.message;
                message.className = data.success ? 'success' : 'error';
            } catch (error) {
                console.error(error);
                message.textContent = 'Impossible de contacter le serveur.';
                message.className = 'error';
            }

            button.disabled = false;
            button.textContent = 'Envoyer le lien';
        });
    </script>

</body>

</html>
