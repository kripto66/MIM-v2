<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mot de passe oublié — Okarne Global Management</title>

    <meta name="description" content="Vous avez oublié votre mot de passe Okarne Global Management ? Réinitialisez-le en quelques étapes.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://mim-app.com/forgot">

    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="/mim-errors.css">
    <script src="/mim-errors.js"></script>

</head>

<body>

    <main class="auth-shell auth-center">

        <section class="auth-panel">

            <div class="auth-card auth-card-sm">

                <a class="brand-mobile" href="index.html">
                    <span class="brand-mark">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5"/><path d="M5 11v8h14v-8"/><path d="M9.5 19v-5h5v5"/></svg>
                    </span>
                    <span class="brand-text">Okarne<strong>GM</strong></span>
                </a>

                <div class="auth-head">
                    <h2>Mot de passe oublié ?</h2>
                    <p class="auth-sub">Pas de problème. Entrez votre adresse email et nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
                </div>

                <form id="forgotForm" novalidate>

                    <div class="form-group">
                        <label for="email">Adresse email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="exemple@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div id="forgotMessage"></div>

                    <button class="btn btn-gold btn-block" type="submit">Envoyer le lien</button>

                </form>

                <a class="back-login" href="connexion.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Retour à la connexion
                </a>

            </div>

        </section>

    </main>

    <script src="form-utils.js"></script>
    <script src="forgot.js"></script>

</body>

</html>
