<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vérification — MIM</title>
    <link rel="stylesheet" href="/mim-errors.css">
    <script src="/mim-errors.js"></script>


    <link rel="stylesheet" href="2fa.css">

</head>

<body>

    <main class="container">

        <section class="card">

            <div class="logo">
                MIM
            </div>

            <h1>
                Double authentification
            </h1>

            <p class="description">
                Entrez le code à 6 chiffres affiché par
                votre application d'authentification
                pour continuer.
            </p>

            <form id="verifyForm">

                <div class="form-group">

                    <label for="code">
                        Code de vérification
                    </label>

                    <input
                        type="text"
                        id="code"
                        name="code"
                        inputmode="numeric"
                        pattern="\d{6}"
                        maxlength="6"
                        placeholder="000000"
                        autocomplete="one-time-code"
                        required
                    >

                </div>

                <div id="verifyMessage"></div>

                <button type="submit">
                    Vérifier
                </button>

            </form>

            <a class="back-login" href="connexion.html">
                ← Retour à la connexion
            </a>

        </section>

    </main>

    <script src="form-utils.js"></script>
    <script src="2fa.js"></script>
        });
    </script>

</body>

</html>
