<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vérification — Okarne Global Management</title>

    <meta name="description" content="Entrez le code de vérification pour accéder à votre espace Okarne Global Management.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://mim-app.com/2fa">

    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="/mim-errors.css">
    <script src="/mim-errors.js"></script>

</head>

<body>

    <main class="auth-shell auth-center">

        <section class="auth-panel">

            <div class="auth-card auth-card-sm">

                <a class="brand-mobile" href="index.html">
                    <img src="/images/logo-okarne.svg" alt="Okarne GM" width="36" height="36" style="display:block;border-radius:8px">
                    <span class="brand-text">Okarne<strong>GM</strong></span>
                </a>

                <div class="auth-head">
                    <h2>Double authentification</h2>
                    <p class="auth-sub">Entrez le code à 6 chiffres affiché par votre application d'authentification pour continuer.</p>
                </div>

                <form id="verifyForm" novalidate>

                    <div class="form-group">
                        <label for="code">Code de vérification</label>
                        <input
                            type="text"
                            id="code"
                            name="code"
                            inputmode="numeric"
                            pattern="\d{6}"
                            maxlength="6"
                            placeholder="000000"
                            autocomplete="one-time-code"
                            required
                        >
                    </div>

                    <div id="verifyMessage"></div>

                    <button class="btn btn-gold btn-block" type="submit">Vérifier</button>

                </form>

                <a class="back-login" href="connexion.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Retour à la connexion
                </a>

            </div>

        </section>

    </main>

    <script src="form-utils.js"></script>
    <script src="2fa.js"></script>

</body>

</html>
