<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okarne GM — Mon parc</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/mim-errors.css">
    <script src="/mim-errors.js"></script>
    <link rel="stylesheet" href="/PartProprietaires/style.css">
    <link rel="stylesheet" href="/PartPublic/mim-ui.css">
</head>

<body data-espace="shadow">

    <div class="dashboard">
        <aside class="sidebar" id="sidebar" data-breakpoint="800">
            <a class="logo" href="dashboard.html" data-sidebar-toggle-logo title="Mon espace délégué">Okarne GM</a>
            <nav class="sidebar-menu">
                <div class="nav-category">Mon espace</div>
                <a href="dashboard.html">Vue d'ensemble</a>
                <a class="active" href="parc.html">Mon parc</a>
                <a href="entretien.html">Entretien</a>
                <a href="versements.html">Versements</a>
                <a href="messages.html">Messagerie</a>
                <a href="rapport.html">Rapport</a>
                <div class="nav-category">Session</div>
                <a href="#" id="logoutBtn">Déconnexion</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <button class="menu-toggle" data-sidebar-toggle aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
                <div id="apiMessage" class="api-message" style="display:none;"></div>
                <div class="welcome">
                    <h1>Mon parc<span class="accent">.</span></h1>
                    <p id="greetingSub">Logements et locataires gérés par votre agence.</p>
                </div>
                <div class="header-actions">
                    <button class="refresh-btn" id="refreshBtn" type="button" title="Actualiser les données">
                        <span class="refresh-ico">↻</span><span>Actualiser</span>
                    </button>
                </div>
            </header>

            <section class="mim-kpi-grid" id="kpis"></section>

            <section class="mim-section">
                <header>
                    <h2>Logements</h2>
                    <span class="section-meta" id="logementsMeta"></span>
                </header>
                <div id="logementsList"></div>
            </section>

            <section class="mim-section">
                <header>
                    <h2>Locataires</h2>
                    <span class="section-meta" id="locatairesMeta"></span>
                </header>
                <div id="locatairesList"></div>
            </section>

            <section class="mim-section">
                <header>
                    <h2>Dépenses du parc</h2>
                    <span class="section-meta" id="depensesMeta"></span>
                </header>
                <div id="depensesList"></div>
            </section>
        </main>
    </div>

    <script src="/PartPublic/mim-ui.js"></script>
    <script src="api.js"></script>
    <script src="parc.js"></script>
    <script src="/PartPublic/sidebar.js"></script>

</body>

</html>
