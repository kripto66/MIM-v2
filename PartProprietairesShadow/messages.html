<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okarne GM — Messagerie</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/mim-errors.css">
    <script src="/mim-errors.js"></script>
    <link rel="stylesheet" href="/PartProprietaires/style.css">
    <link rel="stylesheet" href="/PartPublic/mim-ui.css">
</head>

<body data-espace="shadow">

    <div class="dashboard">
        <aside class="sidebar" id="sidebar" data-breakpoint="800">
            <a class="logo" href="dashboard.html" data-sidebar-toggle-logo title="Mon espace délégué"><img src="/images/logo-okarne.svg" alt="Okarne GM" class="logo-img" width="42" height="42"></a>
            <nav class="sidebar-menu">
                <div class="nav-category">Mon espace</div>
                <a href="dashboard.html">Vue d'ensemble</a>
                <a href="parc.html">Mon parc</a>
                <a href="entretien.html">Entretien</a>
                <a href="versements.html">Versements</a>
                <a class="active" href="messages.html">Messagerie</a>
                <a href="rapport.html">Rapport</a>
                <div class="nav-category">Session</div>
                <a href="#" id="logoutBtn">Déconnexion</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <button class="menu-toggle" data-sidebar-toggle aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
                <div id="apiMessage" class="api-message" style="display:none;"></div>
                <div class="welcome">
                    <h1>Messagerie<span class="accent">.</span></h1>
                    <p id="greetingSub">Échangez avec l'agence qui gère vos biens.</p>
                </div>
            </header>

            <section class="mim-section">
                <header>
                    <h2>Nouveau message</h2>
                    <span class="section-meta">Réponse direct à votre agence</span>
                </header>
                <form id="messageForm" novalidate>
                    <div class="form-group">
                        <label for="objet">Objet (optionnel)</label>
                        <input type="text" id="objet" maxlength="120" placeholder="Ex : Question sur le loyer de mars">
                    </div>
                    <div class="form-group">
                        <label for="corps">Message</label>
                        <textarea id="corps" rows="4" maxlength="4000" required placeholder="Votre message…"></textarea>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-primary" type="submit">Envoyer</button>
                    </div>
                </form>
            </section>

            <section class="mim-section">
                <header>
                    <h2>Historique</h2>
                    <span class="section-meta" id="messagesMeta"></span>
                </header>
                <div id="messagesList"></div>
            </section>
        </main>
    </div>

    <script src="/PartPublic/mim-ui.js"></script>
    <script src="api.js"></script>
    <script src="messages.js"></script>
    <script src="/PartPublic/sidebar.js"></script>

</body>

</html>
