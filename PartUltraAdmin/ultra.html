<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIM Super Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="ultra.css">
  <link rel="stylesheet" href="/mim-errors.css">
</head>
<body>
  <!-- Halos d'ambiance -->
  <div class="halo halo-1" aria-hidden="true"></div>
  <div class="halo halo-2" aria-hidden="true"></div>
  <div class="halo halo-3" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo">MIM</span>
      <span class="ultra-badge">SUPER ADMIN</span>
    </div>

    <nav class="sidebar-nav" aria-label="Navigation principale">
      <div class="nav-section-label">Navigation</div>
      <button class="nav-item active" data-section="dashboard" aria-current="page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Vue globale
      </button>
      <button class="nav-item" data-section="admins">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Administrateurs
      </button>
      <button class="nav-item" data-section="users">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Utilisateurs
      </button>
      <button class="nav-item" data-section="saas">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Gestion SaaS
      </button>

      <div class="nav-section-label">Contenu</div>
      <button class="nav-item" data-section="announcements">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Annonces
      </button>
      <button class="nav-item" data-section="events">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Événements
      </button>
      <button class="nav-item" data-section="featured">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Mise en avant
      </button>

      <div class="nav-section-label">Sécurité</div>
      <button class="nav-item" data-section="audit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Journal d'audit
      </button>

      <div class="nav-section-label">Outils</div>
      <button class="nav-item" data-section="simulation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Simulation
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-item" id="adminPanelLink" data-section="" onclick="window.location.href='../PartAdmin/admin.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Panel Admin
      </button>
      <div class="admin-mini" id="adminIdentity">
        <div class="avatar" id="adminAvatar">—</div>
        <div>
          <div class="admin-name" id="adminName">Chargement...</div>
          <div class="admin-role">Super Admin</div>
        </div>
      </div>
      <button class="nav-item logout-btn" id="logoutBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Déconnexion
      </button>
    </div>
  </aside>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main -->
  <main class="main" id="main">
    <!-- Topbar -->
    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-text">
        <h1 class="topbar-title" id="pageTitle">Vue globale</h1>
        <p class="topbar-subtitle" id="pageSubtitle">Tableau de bord Super Admin</p>
      </div>
      <div class="topbar-right">
        <div class="sys-status" id="sysStatus">
          <span class="sys-dot"></span>
          <span class="sys-text">VÉRIFICATION...</span>
        </div>
        <button class="btn secondary" id="refreshBtn" aria-label="Rafraîchir">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
      </div>
    </header>

    <!-- Contenu SPA -->
    <div class="content" id="app">
      <!-- Rendu par ultra.js -->
    </div>
  </main>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Progress bar -->
  <div id="progressContainer">
    <div id="progressBar"></div>
    <span id="progressLabel"></span>
  </div>

  <!-- Modal : Créer Admin -->
  <div class="modal-overlay" id="createAdminModal">
    <div class="modal-panel">
      <div class="modal-header">
        <h2>Créer un Administrateur</h2>
        <button class="modal-close" onclick="document.getElementById('createAdminModal').classList.remove('active')">&times;</button>
      </div>
      <form id="createAdminForm">
        <div class="form-group">
          <label for="adminName">Nom complet</label>
          <input type="text" id="adminName" name="name" placeholder="Nom de l'administrateur" required>
        </div>
        <div class="form-group">
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" name="email" placeholder="email@exemple.com" required>
        </div>
        <div class="form-group">
          <label for="adminUsername">Username</label>
          <input type="text" id="adminUsername" name="username" placeholder="nom_utilisateur" required>
        </div>
        <div class="form-group">
          <label for="adminPassword">Mot de passe (optionnel)</label>
          <input type="password" id="adminPassword" name="password" placeholder="Laisser vide pour un mot de passe temporaire">
          <small class="field-help">Si vide, un mot de passe temporaire sera généré.</small>
        </div>
        <div class="form-actions">
          <button type="button" class="btn secondary" onclick="document.getElementById('createAdminModal').classList.remove('active')">Annuler</button>
          <button type="submit" class="btn primary">Créer le compte</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal : Confirmation -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-panel modal-confirm">
      <div class="modal-header">
        <h2 id="confirmTitle">Confirmer l'action</h2>
        <button class="modal-close" onclick="document.getElementById('confirmModal').classList.remove('active')">&times;</button>
      </div>
      <p id="confirmMessage"></p>
      <div class="form-group" id="confirmInputGroup" style="display:none">
        <label for="confirmInput" id="confirmInputLabel"></label>
        <input type="text" id="confirmInput" class="confirm-input">
      </div>
      <div class="form-actions">
        <button class="btn secondary" onclick="resolveConfirm(false)">Annuler</button>
        <button class="btn danger" id="confirmBtn">Confirmer</button>
      </div>
    </div>
  </div>

  <script src="/mim-errors.js"></script>
  <script src="/PartPublic/form-utils.js"></script>
  <script src="ultra.js"></script>
</body>
</html>
